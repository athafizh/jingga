<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Jingga</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0b1a;--cd:#1a1733;--tx:#f4f1ff;--mu:#9d97c4;--ac:linear-gradient(135deg,#ff9a2e,#ff3d81)}
body{background:radial-gradient(circle at 85% -5%,#5a1f4a66,transparent 45%),radial-gradient(circle at 0 30%,#ff7a1822,transparent 40%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.4 system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 100px}
button,input,select,textarea{font:inherit;color:inherit}
#sp{position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
#sp h1{font-size:68px;font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#ffb347,#ff5e62,#ff3d81,#ffb347);background-size:300%;-webkit-background-clip:text;color:transparent;animation:fl 2s ease both}
#sp p{color:var(--mu);margin-top:6px;animation:fl 2s .3s ease both}
@keyframes fl{0%{opacity:0;transform:scale(.8);background-position:0}60%{opacity:1}100%{opacity:1;transform:none;background-position:100%}}
.wrap{padding:18px 16px;max-width:560px;margin:auto}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.hd h2{font-size:26px;font-weight:800}.hd p{color:var(--mu)}
.ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff9a2e var(--p),#2a2650 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.bn{background:var(--ac);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600;color:#1a0b00}
.gt{margin:18px 0 8px;font-weight:700;color:var(--mu)}
.card{display:flex;gap:12px;align-items:center;background:var(--cd);border-radius:18px;padding:12px;margin-bottom:10px;border-left:5px solid var(--c);box-shadow:0 0 22px -8px var(--c)}
.card.done{opacity:.5}.card.done .tt{text-decoration:line-through}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);background:none;font-weight:800;color:#fff}
.done .chk{background:var(--c)}
.body{flex:1;min-width:0}.mk{font-size:12px;color:var(--c);font-weight:700}.tt{font-weight:700;margin:1px 0}.dt{font-size:12px;color:var(--mu)}
.ic{flex:none;display:flex;flex-direction:column;gap:6px}
.ic button{background:#2a2650;border:0;border-radius:10px;width:34px;height:30px}
.late .dt{color:#ff6b81}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#120f26ee;backdrop-filter:blur(10px);padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #2a2650}
nav button{flex:1;background:none;border:0;padding:8px;color:var(--mu);font-weight:600}
nav button.on{color:#ffb347}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);font-size:30px;color:#1a0b00;box-shadow:0 8px 24px #ff3d8155}
#sh{display:none;position:fixed;inset:0;z-index:50}#sh.open{display:block}
.bd{position:absolute;inset:0;background:#000a}
.pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#1a1733;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.pn h3{margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0d0b1a;border:1px solid #2f2a5c;border-radius:12px;padding:11px}
input[type=color]{height:44px;padding:3px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.ch{padding:7px 12px;border-radius:99px;background:#2a2650;border:0;font-size:13px}.ch.on{background:var(--ac);color:#1a0b00;font-weight:700}
.btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--ac);color:#1a0b00;font-weight:800;margin-top:14px}
.btn.g{background:#2a2650;color:var(--tx);margin-top:8px}.btn.r{background:#3a1626;color:#ff8da1;margin-top:8px}
.set{background:var(--cd);border-radius:18px;padding:14px;margin-bottom:12px}.set p{color:var(--mu);font-size:13px;margin:4px 0 8px}
.em{text-align:center;color:var(--mu);padding:40px 10px}
#ts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#fff;color:#1a0b00;padding:10px 16px;border-radius:14px;font-weight:600;z-index:120;max-width:90%;display:none}
.cf{position:fixed;z-index:130;pointer-events:none;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="sp"><h1>Jingga</h1><p>tugas rapi, hati tenang ✨</p></div>
<div id="ts"></div><div class="wrap" id="app"></div>
<button id="fab" onclick="tab=='c'?openCourse():openTask()">+</button>
<nav><button data-t="t" onclick="go('t')">📋 Tugas</button><button data-t="c" onclick="go('c')">🎨 Matkul</button><button data-t="s" onclick="go('s')">⚙️ Pengaturan</button></nav>
<div id="sh"></div>
<script>
const K='jingga.v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=[['Patient Safety','🛡️','#ff5d73'],['Metodologi Penelitian','📖','#a78bfa'],['Biostatistik','📊','#38bdf8'],['PKKB','🚑','#fb923c'],['Promosi Kesehatan','🌱','#34d399'],['Evidence Based Nursing','📚','#c084fc'],['Keperawatan Komunitas','🏘️','#facc15'],['Interprofesional Education','🤝','#2dd4bf'],['Praktikum Komunitas','🩺','#f472b6']];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.courses)S={courses:DEF.map(d=>({id:uid(),name:d[0],emoji:d[1],color:d[2],dosen:''})),tasks:[]};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
let tab='t',F;
const fmt=d=>d.toLocaleString('id-ID',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const rl=m=>(m%1440==0?'H-'+m/1440:m%60==0?m/60+' jam':m+' mnt')+(m%1440==0?'':' sebelum');
const crs=id=>S.courses.find(c=>c.id==id)||{name:'(matkul dihapus)',emoji:'📌',color:'#888'};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
function go(t){tab=t;render();scrollTo(0,0)}
function card(t){const c=crs(t.cid),d=new Date(t.due),late=!t.done&&d<Date.now();
return `<div class="card ${t.done?'done':''} ${late?'late':''}" style="--c:${c.color}"><button class="chk" onclick="tog('${t.id}',event)">${t.done?'✓':''}</button><div class="body" onclick="openTask('${t.id}')"><div class="mk">${c.emoji} ${esc(c.name)}${t.type?' • '+esc(t.type):''}</div><div class="tt">${esc(t.title)}</div><div class="dt">⏰ ${fmt(d)}${t.old?` (awal: ${fmt(new Date(t.old))})`:''}</div></div><div class="ic">${t.link?`<button onclick="window.open('${esc(t.link)}','_blank')">🔗</button>`:''}<button onclick="gcal('${t.id}')">📅</button></div></div>`}
function vTasks(){const n=new Date(),eT=new Date(n);eT.setHours(23,59,59,999);const wk=+eT+6048e5;
const g={'🔥 Terlambat':[],'📍 Hari ini':[],'📅 Minggu ini':[],'🌙 Nanti':[]},dn=[];
[...S.tasks].sort((a,b)=>new Date(a.due)-new Date(b.due)).forEach(t=>{const d=+new Date(t.due);
if(t.done)dn.unshift(t);else if(d<n)g['🔥 Terlambat'].push(t);else if(d<=eT)g['📍 Hari ini'].push(t);else if(d<=wk)g['📅 Minggu ini'].push(t);else g['🌙 Nanti'].push(t)});
const tot=S.tasks.length,p=tot?Math.round(dn.length/tot*100):0,u=g['🔥 Terlambat'].length+g['📍 Hari ini'].length;
let h=`<div class="hd"><div><h2>Halo, Jingga 👋</h2><p>${tot-dn.length} tugas belum selesai</p></div><div class="ring" style="--p:${p}%"><b>${p}%</b></div></div>`;
if(u)h+=`<div class="bn">⚡ ${u} tugas perlu perhatian hari ini</div>`;
if(!tot)return h+`<div class="em">Belum ada tugas.<br>Ketuk tombol <b>+</b> untuk menambah tugas pertama.</div>`;
for(const k in g)if(g[k].length)h+=`<div class="gt">${k} (${g[k].length})</div>`+g[k].map(card).join('');
if(dn.length)h+=`<div class="gt">✅ Selesai (${dn.length})</div>`+dn.slice(0,15).map(card).join('');
return h}
function vCourses(){return `<div class="hd"><div><h2>Mata kuliah</h2><p>Atur sekali, pakai terus</p></div></div>`+S.courses.map(c=>`<div class="card" style="--c:${c.color}" onclick="openCourse('${c.id}')"><div style="font-size:26px">${c.emoji}</div><div class="body"><div class="tt">${esc(c.name)}</div><div class="dt">${S.tasks.filter(t=>t.cid==c.id).length} tugas${c.dosen?' • '+esc(c.dosen):''}</div></div></div>`).join('')}
function vSet(){const np=window.Notification?Notification.permission:'tidak didukung';
return `<div class="hd"><div><h2>Pengaturan</h2></div></div>
<div class="set"><b>🔔 Notifikasi</b><p>Status: ${np}. Pengingat berbunyi saat aplikasi aktif/baru dibuka. Untuk tugas penting, pakai tombol 📅 (Google Calendar) agar pasti berbunyi.</p><button class="btn g" onclick="askN()">Izinkan notifikasi</button></div>
<div class="set"><b>💾 Backup</b><p>Simpan file backup ke Google Drive/WA. Dipakai kalau ganti HP.</p><button class="btn" onclick="exp()">Simpan backup</button><button class="btn g" onclick="$('#im').click()">Pulihkan dari file</button><input type="file" id="im" accept=".json" hidden onchange="imp(event)"></div>
<div class="set"><b>🔋 Tips Samsung</b><p>Pengaturan HP → Aplikasi → Jingga → Baterai → pilih "Tidak dibatasi".</p></div>
<div class="set"><button class="btn r" onclick="if(confirm('Hapus SEMUA data?')){localStorage.removeItem(K);location.reload()}">Hapus semua data</button></div>`}
function render(){$('#app').innerHTML=tab=='t'?vTasks():tab=='c'?vCourses():vSet();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));$('#fab').style.display=tab=='s'?'none':''}
function sheet(h){$('#sh').innerHTML='<div class="bd" onclick="closeS()"></div><div class="pn">'+h+'</div>';$('#sh').className='open'}
function closeS(){$('#sh').className=''}
function tog(id,ev){ev.stopPropagation();const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();if(t.done)pop(ev.clientX,ev.clientY);render()}
function pop(x,y){for(let i=0;i<12;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','✨','🧡','⭐'][i%4];s.style.cssText=`left:${x}px;top:${y}px;--dx:${(Math.random()-.5)*220}px;--dy:${-60-Math.random()*130}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function openTask(id){const t=id?S.tasks.find(x=>x.id==id):null,d=new Date(Date.now()+864e5);d.setHours(23,59,0,0);
const pad=n=>String(n).padStart(2,'0'),loc=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T23:59`;
F=t?{...t,rem:[...t.rem]}:{id:null,cid:S.courses[0]&&S.courses[0].id,title:'',due:loc,link:'',type:'Individu',note:'',rem:[1440,180]};
sheet(`<h3>${t?'Edit tugas':'Tugas baru'}</h3><label>Matkul</label><select id="f_cid">${S.courses.map(c=>`<option value="${c.id}" ${c.id==F.cid?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}</select>
<label>Judul tugas</label><input id="f_title" value="${esc(F.title)}" placeholder="mis. LKS Uji Normalitas">
<label>Deadline ${t&&t.due?'(ubah tanggal = otomatis tercatat sebagai extend)':''}</label><input type="datetime-local" id="f_due" value="${F.due}">
<label>Tipe</label><select id="f_type">${['Individu','Kelompok','Tulis tangan','UTS/UAS','Proyek'].map(x=>`<option ${x==F.type?'selected':''}>${x}</option>`).join('')}</select>
<label>Link Google Drive</label><input id="f_link" value="${esc(F.link)}" placeholder="https://drive.google.com/...">
<label>Catatan</label><textarea id="f_note" rows="2">${esc(F.note)}</textarea>
<label>Pengingat</label><div class="chs" id="rc"></div>
<div class="row" style="margin-top:8px"><input type="number" id="cn" min="1" placeholder="angka"><select id="cu"><option value="60">jam</option><option value="1440">hari</option><option value="1">menit</option></select><button class="ch" onclick="addR()">+ Tambah</button></div>
<button class="btn" onclick="saveTask()">Simpan</button>${t?`<button class="btn g" onclick="gcal('${t.id}')">📅 Tambah ke Google Calendar</button><button class="btn r" onclick="delTask('${t.id}')">Hapus tugas</button>`:''}`);rc()}
function rc(){const all=[...new Set([4320,2880,1440,180,60,...F.rem])].sort((a,b)=>b-a);$('#rc').innerHTML=all.map(m=>`<button class="ch ${F.rem.includes(m)?'on':''}" onclick="tr(${m})">${rl(m)}</button>`).join('')}
function tr(m){F.rem=F.rem.includes(m)?F.rem.filter(x=>x!=m):[...F.rem,m];rc()}
function addR(){const n=+$('#cn').value,m=Math.round(n*$('#cu').value);if(!n||m<1)return;if(!F.rem.includes(m))F.rem.push(m);$('#cn').value='';rc()}
function saveTask(){const v=k=>$('#f_'+k).value;if(!v('title').trim()||!v('due')||!v('cid'))return toast('Isi matkul, judul, dan deadline dulu ya');
const o={cid:v('cid'),title:v('title').trim(),due:v('due'),link:v('link').trim(),type:v('type'),note:v('note').trim(),rem:F.rem};
const pf=()=>o.rem.filter(r=>new Date(o.due)-r*6e4<=Date.now());
if(F.id){const t=S.tasks.find(x=>x.id==F.id);if(t.due!=o.due){t.old=t.old||t.due;o.fired=pf()}Object.assign(t,o)}else S.tasks.push({id:uid(),done:false,fired:pf(),...o});
save();closeS();render();notifyOn()}
function delTask(id){if(confirm('Hapus tugas ini?')){S.tasks=S.tasks.filter(x=>x.id!=id);save();closeS();render()}}
function openCourse(id){const c=id?S.courses.find(x=>x.id==id):{emoji:'📘',color:'#ff9a2e',name:'',dosen:''};F=c;
sheet(`<h3>${id?'Edit matkul':'Matkul baru'}</h3><div class="row"><div style="flex:1"><label>Emoji</label><input id="c_e" value="${c.emoji}"></div><div style="flex:1"><label>Warna</label><input type="color" id="c_c" value="${c.color}"></div></div><label>Nama matkul</label><input id="c_n" value="${esc(c.name)}"><label>Dosen (opsional)</label><input id="c_d" value="${esc(c.dosen)}"><button class="btn" onclick="saveCourse('${id||''}')">Simpan</button>${id?`<button class="btn r" onclick="delCourse('${id}')">Hapus matkul</button>`:''}`)}
function saveCourse(id){const o={emoji:$('#c_e').value||'📘',color:$('#c_c').value,name:$('#c_n').value.trim(),dosen:$('#c_d').value.trim()};if(!o.name)return toast('Nama matkul wajib diisi');
if(id)Object.assign(S.courses.find(x=>x.id==id),o);else S.courses.push({id:uid(),...o});save();closeS();render()}
function delCourse(id){if(S.tasks.some(t=>t.cid==id))return toast('Matkul masih punya tugas. Hapus tugasnya dulu.');if(confirm('Hapus matkul?')){S.courses=S.courses.filter(c=>c.id!=id);save();closeS();render()}}
function gcal(id){const t=S.tasks.find(x=>x.id==id),c=crs(t.cid),s=new Date(t.due),e=new Date(+s+18e5),z=d=>d.toISOString().replace(/[-:]|\.\d+/g,'');
window.open('https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(c.emoji+' '+t.title)+'&dates='+z(s)+'/'+z(e)+'&details='+encodeURIComponent(c.name+(t.link?'\n'+t.link:'')),'_blank')}
function exp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='jingga-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Backup disimpan ✅')}
function imp(e){const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const d=JSON.parse(x);if(!d.courses||!d.tasks)throw 0;if(!confirm('Ganti semua data dengan backup ini?'))return;S=d;save();render();toast('Data dipulihkan ✅')}catch(_){toast('File backup tidak valid')}})}
function askN(){if(!window.Notification)return toast('Browser tidak mendukung notifikasi');Notification.requestPermission().then(()=>render())}
async function notifyOn(t,b){toast(t+' — '+b)}
async function ntf(t,b){toast(t+' — '+b);if(window.Notification&&Notification.permission=='granted'){try{const r=await navigator.serviceWorker.ready;r.showNotification(t,{body:b,icon:'icon-192.png',badge:'icon-192.png',tag:t})}catch(_){}}}
function check(){const n=Date.now();let ch=0;S.tasks.forEach(t=>{if(t.done)return;t.fired=t.fired||[];const due=+new Date(t.due);t.rem.forEach(r=>{if(n>=due-r*6e4&&!t.fired.includes(r)&&n<due+216e5){t.fired.push(r);ch=1;ntf('⏰ '+crs(t.cid).name,t.title+' ('+rl(r)+') — '+fmt(new Date(due)))}})});if(ch){save();render()}}
notifyOn=()=>check();
render();setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),600)},2200);
setInterval(check,3e4);document.addEventListener('visibilitychange',()=>{if(!document.hidden){check();render()}});setTimeout(check,2500);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
